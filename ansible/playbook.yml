---
- name: Deploy Likpi CMDB Enterprise
  hosts: cmdb_servers
  become: yes
  vars:
    likpi_user: likpiadm
    likpi_group: likpi
    install_dir: /opt/likpi
    backend_download_url: "https://github.com/likpi-cmdb/likpi-iac-deployments/releases/download/v1.0.0/cmdb-app-latest-fat.jar"
    frontend_download_url: "https://github.com/likpi-cmdb/likpi-iac-deployments/releases/download/v1.0.0/cmdb-frontend-build.zip"

  tasks:
    - name: Install system dependencies (Java 17, Nginx, PostgreSQL, unzip)
      apt:
        name:
          - openjdk-17-jre-headless
          - nginx
          - postgresql-15
          - unzip
        state: present
        update_cache: yes

    - name: Create Likpi group and user
      group:
        name: "{{ likpi_group }}"
        state: present
    - user:
        name: "{{ likpi_user }}"
        group: "{{ likpi_group }}"
        home: /home/{{ likpi_user }}
        shell: /bin/bash
        state: present

    - name: Create isolated application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ likpi_user }}"
        group: "{{ likpi_group }}"
        mode: '0755'
      loop:
        - "{{ install_dir }}/cmdb-backend"
        - "{{ install_dir }}/cmdb-frontend/html"
        - "{{ install_dir }}/security"
        - "{{ install_dir }}/gitops"

    - name: Download Backend Fat JAR
      get_url:
        url: "{{ backend_download_url }}"
        dest: "{{ install_dir }}/cmdb-backend/cmdb-app-latest-fat.jar"
        owner: "{{ likpi_user }}"
        group: "{{ likpi_group }}"
        mode: '0644'
      ignore_errors: yes

    - name: Register Likpi Backend as a systemd service
      copy:
        dest: /etc/systemd/system/cmdb-backend.service
        content: |
          [Unit]
          Description=Likpi CMDB Backend Service
          After=network.target postgresql.service

          [Service]
          Type=simple
          User={{ likpi_user }}
          Group={{ likpi_group }}
          WorkingDirectory={{ install_dir }}/cmdb-backend
          ExecStart=/usr/bin/java -jar {{ install_dir }}/cmdb-backend/cmdb-app-latest-fat.jar -conf {{ install_dir }}/cmdb-backend/config.json
          Restart=on-failure
          RestartSec=10
          SyslogIdentifier=cmdb-backend

          [Install]
          WantedBy=multi-user.target
      notify: Restart Likpi Backend

    - name: Ensure core services are enabled and started
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
        daemon_reload: yes
      loop:
        - postgresql
        - nginx

  handlers:
    - name: Restart Likpi Backend
      systemd:
        name: cmdb-backend
        state: restarted
