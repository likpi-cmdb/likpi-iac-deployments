name: Validate CMDB YAML

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**/likpi.yaml'
      - '.github/workflows/validate-cmdb.yml'

jobs:
  validate-likpi-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Validation Dependencies
        run: npm install ajv ajv-formats js-yaml @actions/glob

      - name: Validate Multi-Document YAML Against Likpi Gatekeeper
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            const Ajv = require('ajv');
            const addFormats = require('ajv-formats');
            const glob = require('@actions/glob');

            const cmdbUrl = process.env.LIKPI_CMDB_URL || 'https://cmdb.yourdomain.com';
            
            let schema;
            try {
              const response = await fetch(`${cmdbUrl}/api/v1/schema/json-schema`);
              if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
              }
              schema = await response.json();
            } catch (err) {
              console.error(`❌ Failed to fetch live schema from CMDB: ${err.message}`);
              process.exit(1);
            }

            const ajv = new Ajv({ strict: false });
            addFormats(ajv);
            const validate = ajv.compile(schema);

            const globber = await glob.create('**/likpi.yaml');
            const files = await globber.glob();
            
            if (files.length === 0) {
              console.log('No likpi.yaml files found to validate.');
              process.exit(0);
            }

            let hasFailure = false;

            for (const file of files) {
              console.log(`\n🔍 Checking file: ${file}`);
              const rawContent = fs.readFileSync(file, 'utf8');
              const docs = yaml.loadAll(rawContent);
              
              docs.forEach((doc, idx) => {
                if (!doc) return;
                const docName = doc?.metadata?.name || `Doc #${idx + 1}`;
                const isValid = validate(doc);

                if (!isValid) {
                  console.error(`❌ Validation FAILED for [${docName}] (${doc?.kind || 'Unknown'}):`);
                  console.error(JSON.stringify(validate.errors, null, 2));
                  hasFailure = true;
                } else {
                  console.log(`✅ Passed: [${docName}] (${doc.kind})`);
                }
              });
            }

            if (hasFailure) {
              console.error('\n💥 One or more CIs violated schema constraints. Pull request blocked.');
              process.exit(1);
            } else {
              console.log('\n🚀 All Configuration Items are 100% compliant with Likpi CMDB schema.');
            }
